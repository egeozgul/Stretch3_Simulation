stretch:
  planner_server:
    ros__parameters:
      expected_planner_frequency: 10.0
      use_sim_time: false
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: nav2_navfn_planner/NavfnPlanner
        tolerance: 0.10
        use_astar: true
        allow_unknown: false

  controller_server:
    ros__parameters:
      use_sim_time: false
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.001
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: progress_checker
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.25
        movement_time_allowance: 15.0
      general_goal_checker:
        stateful: true
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 0.07
        yaw_goal_tolerance: 0.35
      FollowPath:
        plugin: dwb_core::DWBLocalPlanner
        debug_trajectory_details: true
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.50
        max_vel_y: 0.0
        max_vel_theta: 1.6
        min_speed_xy: 0.0
        max_speed_xy: 0.50
        min_speed_theta: 0.0
        acc_lim_x: 3.0
        acc_lim_y: 0.0
        acc_lim_theta: 3.5
        decel_lim_x: -3.0
        decel_lim_y: 0.0
        decel_lim_theta: -3.5
        vx_samples: 20
        vy_samples: 1
        vtheta_samples: 20
        sim_time: 1.7
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        xy_goal_tolerance: 0.07
        trans_stopped_velocity: 0.15
        short_circuit_trajectory_evaluation: true
        stateful: true
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        BaseObstacle.scale: 0.08
        PathAlign.scale: 24.0
        PathAlign.forward_point_distance: 0.1
        GoalAlign.scale: 16.0
        GoalAlign.forward_point_distance: 0.1
        PathDist.scale: 24.0
        GoalDist.scale: 16.0
        RotateToGoal.scale: 12.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 8.0
        publish_frequency: 4.0
        global_frame: stretch/odom
        robot_base_frame: stretch/base_link
        use_sim_time: false
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.24
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /stretch/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 6.0
          inflation_radius: 0.16
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 2.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: stretch/base_link
        use_sim_time: false
        robot_radius: 0.24
        resolution: 0.05
        track_unknown_space: false
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_topic: /map
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: nav2_costmap_2d::ObstacleLayer
          enabled: true
          observation_sources: scan
          scan:
            topic: /stretch/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: LaserScan
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 6.0
          inflation_radius: 0.25
        always_send_full_costmap: true
