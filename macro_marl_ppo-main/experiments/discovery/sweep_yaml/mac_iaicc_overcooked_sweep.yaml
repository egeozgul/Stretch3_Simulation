# Overcooked MacIAICC — full hyperparameter sweep
# ============================================================================
# Grid: a_lr x c_lr x n_step_TD x train_freq x 3 seeds = 108 runs.
# Env: task 9, map D, n_agent 2 (matches experiments/Overcooked/mac_iac.sh).
# l_mode pinned to 0 (default leader mode); change below if you want to sweep it.
# ============================================================================
program: 'pg_based_main.py'
method: grid
name: mac_iaicc_overcooked_sweep

parameters:
  # ---------------- Algorithm ----------------
  alg:
    value: 'MacIAICC'

  # MacIAICC-specific: leader mode. 0 = default; expand to `values: [0, 1]` to sweep.
  l_mode:
    value: 0

  # ---------------- Environment ----------------
  mode:
    value: 'vector'
  env_id:
    value: 'Overcooked-MA-v1'
  n_agent:
    value: 2
  env_terminate_step:
    value: 200
  grid_dim:
    value: '7 7'
  task:
    value: 9
  map_type:
    value: 'D'
  step_penalty:
    value: -0.1

  # ---------------- Training loop ----------------
  train_freq:
    values:
      - 8
      - 16
  n_env:
    value: 4
  c_target_update_freq:
    value: 32
  n_step_TD:
    value: 5
  grad_clip_norm:
    value: 0

  # ---------------- Exploration ----------------
  eps_start:
    value: 1.0
  eps_end:
    value: 0.05
  eps_stable_at:
    value: 50000

  # ---------------- Duration ----------------
  total_epi:
    value: 200000
  gamma:
    value: 0.99

  # ---------------- Learning rates ----------------
  a_lr:
    values:
      - 0.0001
      - 0.0003
      - 0.0004
  c_lr:
    values:
      - 0.001
      - 0.003
      - 0.005

  # ---------------- Eval/logging flags ----------------
  tracking:
    value: ''
  eval_policy:
    value: ''
  sample_epi:
    value: ''

  # ---------------- Seeds ----------------
  run_id:
    values:
      - 0
      - 1
      - 2

  # ---------------- Save dir base ----------------
  save_dir:
    value: 'mac_iaicc_overcooked_D_sweep'
