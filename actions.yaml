# ACTION PARAMETERS AND CONSTANTS
# ============================================================================
# Define common parameters and constants that can be referenced in actions

constants:
  # Anchor mappings (to be populated based on actual anchor positions)
  anchors:
    A: "Table 1, left side"
    B: "Table 1, right side"
    C: "Table 2, left side"
    D: "Table 2, right side"
    E: "Table 3 area"
    F: "Table 3 area"
  
  # Object locations (approximate positions - to be refined)
  object_positions:
    tomato:
      table: 2
      side: "right"
      approximate_y: 4.5
    lettuce:
      table: 1
      side: "left"
      approximate_y: 0.5
    onion:
      table: 2
      side: "left"
      approximate_y: 4.5
    plate:
      table: 3
      approximate_x: 2.4
      approximate_y: 2.5
    knife:
      table: 1
      approximate_x: 0.0
      approximate_y: 0.0
  
  # Arm positions
  arm_positions:
    default_lift: 0.6
    default_arm_extend: 0.0
    default_wrist_yaw: 1.125
    default_gripper: 0.04
    pickup_height: 0.4
    delivery_height: 0.5

